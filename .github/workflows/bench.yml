name: SIL and HIL bench

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  bench:
    name: Python 3.12 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate and compare test designs
        shell: pwsh
        run: |
          python -m bench.case_design
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -Raw artifacts/coverage.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Execute SIL and HIL tests
        run: python -m pytest
      - name: Upload test protocols and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bench-reports-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
